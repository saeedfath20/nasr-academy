workflows:
  nasr-ios-simulator:
    name: Nasr iOS - unsigned compile check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: "22"
      xcode: latest
    scripts:
      - name: Prepare shared application and iOS packages
        script: bash mobile-app/scripts/prepare-ios-cloud.sh
      - name: Compile iOS Simulator application
        script: bash mobile-app/scripts/build-ios-cloud.sh simulator
    artifacts:
      - build/ios-simulator/Nasr-iOS-simulator.zip
      - build/ios-simulator/xcodebuild.log

  nasr-ios-ipa:
    name: Nasr iOS - signed IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: "22"
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nasr.academy
    scripts:
      - name: Prepare shared application and iOS packages
        script: bash mobile-app/scripts/prepare-ios-cloud.sh
      - name: Build signed IPA with uploaded signing identities
        script: bash mobile-app/scripts/build-ios-cloud.sh ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
