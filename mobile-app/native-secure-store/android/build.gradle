plugins { id 'com.android.library' }
android {
 namespace 'com.nasr.securestore'
 compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
 defaultConfig { minSdk rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_21
  targetCompatibility JavaVersion.VERSION_21
 }
}
dependencies {
 implementation project(':capacitor-android')
 // Plugin.getActivity() exposes AppCompatActivity on this module's compile classpath.
 implementation "androidx.appcompat:appcompat:${rootProject.ext.has('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'}"
 implementation "androidx.core:core:${rootProject.ext.has('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.17.0'}"
 implementation "androidx.fragment:fragment:${rootProject.ext.has('androidxFragmentVersion') ? rootProject.ext.androidxFragmentVersion : '1.8.9'}"
 implementation 'androidx.biometric:biometric:1.1.0'
}
