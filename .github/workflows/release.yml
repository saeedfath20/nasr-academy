name: Nasr shared release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check that mobile releases are enabled
        run: node -e "if (require('./release.json').mobileUpdatesPaused !== false) throw new Error('Mobile releases are paused')"
      - name: Test update signatures, rollback and data preservation
        run: node tests/update-engine.mjs
      - name: Restore existing signing identities
        env:
          OTA_KEY: ${{ secrets.NASR_OTA_PRIVATE_KEY }}
          ANDROID_KEY: ${{ secrets.NASR_ANDROID_KEYSTORE_B64 }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          if(!process.env.OTA_KEY||!process.env.ANDROID_KEY)throw new Error('Configure the existing OTA and Android signing secrets. New keys are never generated by CI.');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/ota-private.pem',process.env.OTA_KEY,{mode:0o600});
          fs.writeFileSync(process.env.RUNNER_TEMP+'/nasr.keystore',Buffer.from(process.env.ANDROID_KEY,'base64'),{mode:0o600});
          JS
      - name: Build WordPress, PWA and signed interface together
        working-directory: mobile-app
        run: |
          npm ci --no-audit --no-fund
          npm run release -- --key "$RUNNER_TEMP/ota-private.pem"
          npx cap sync android
      - name: Build Android with the existing owner key
        working-directory: mobile-app/android
        env:
          NASR_ANDROID_KEYSTORE: ${{ runner.temp }}/nasr.keystore
          NASR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NASR_ANDROID_KEYSTORE_PASSWORD }}
          NASR_ANDROID_KEY_ALIAS: ${{ secrets.NASR_ANDROID_KEY_ALIAS }}
          NASR_ANDROID_KEY_PASSWORD: ${{ secrets.NASR_ANDROID_KEY_PASSWORD }}
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: nasr-shared-release
          path: |
            dist-release/*.zip
            mobile-app/android/app/build/outputs/apk/debug/*.apk
